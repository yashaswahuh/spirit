name: Build and Deploy Spirit via GitHub Actions

on:
  push:
    branches:
      - main
      - master
      - phase-6
  pull_request:
    branches:
      - main
      - master
      - phase-6
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Vite base path (leave blank to use default /spirit/)'
        required: false
        default: ''

# Set permissions for GitHub Actions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and accessibility tests
        run: npm test

      - name: Build production application
        env:
          # Configurable base path with /spirit/ default for GitHub Actions deployment
          VITE_BASE_PATH: ${{ inputs.base_path || vars.VITE_BASE_PATH || '/spirit/' }}
        run: npm run build

      - name: Upload build artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: spirit-dist
          path: './dist'
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/phase-6' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy via GitHub Actions
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/phase-6' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages via Actions
        id: deployment
        uses: actions/deploy-pages@v4
