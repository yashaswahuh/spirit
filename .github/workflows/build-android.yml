name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - phase-6
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    branches:
      - main
      - master
      - phase-6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application and sync Capacitor
        env:
          VITE_BASE_PATH: /
        run: npm run build:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and ensure spirit-alpha.apk
        run: |
          ls -la android/app/build/outputs/apk/debug/
          if [ ! -f android/app/build/outputs/apk/debug/spirit-alpha.apk ]; then
            cp android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/debug/spirit-alpha.apk
          fi

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spirit-alpha
          path: android/app/build/outputs/apk/debug/spirit-alpha.apk
          retention-days: 30

      - name: Attach APK and OTA Bundle to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/spirit-alpha.apk
            dist/dist-ota.zip
            dist/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

